<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm A</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;color:#222;background:#eee}
.frame{margin:16px auto;max-width:1100px}.tag{font:12px monospace;color:#666;margin:0 0 4px 4px}
.screen{background:#fff;border:2px solid #999;padding:16px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:16px;margin:16px 0 6px;color:#555}
input[type=text]{width:100%;padding:10px;border:2px solid #888;background:#f4f4f4;font:inherit}
label{display:block;font-weight:600;margin-bottom:4px}
button{padding:10px 14px;border:2px solid #666;background:#ddd;font:inherit;min-height:44px;min-width:44px}
ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ccc}
li .t{flex:1}li small{display:block;color:#595959}.done .t{text-decoration:line-through;color:#595959}
.err{border:2px solid #444;background:#e8e8e8;padding:8px;margin:8px 0}.empty{padding:24px;text-align:center;color:#595959;border:2px dashed #aaa}
.row{display:flex;gap:8px}.row input{flex:1}.card{border:2px solid #999;padding:10px;margin:8px 0}
.cols{display:grid;gap:16px}@media(min-width:800px){.cols{grid-template-columns:1fr 1fr}}
.bar{background:#fff;border-top:2px solid #999;padding:10px 0}
dialog{position:static;display:block;border:2px solid #444;padding:16px;max-width:360px;margin:12px auto}
.ph{background:#ccc;height:12px;margin:6px 0}
.chk{display:flex;flex:1;align-items:center;gap:10px;min-height:44px;margin:0;font-weight:400}
input[type=checkbox]{width:24px;height:24px;flex:none}
button.del{background:none;border:0;color:#444;text-decoration:underline;font-size:15px;padding:10px}
button.danger{background:#444;color:#fff;border-color:#222;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top h1{margin:0}.who{margin:0;font-size:15px}
.fe{margin:4px 0 0;color:#222;font-weight:600}input[aria-invalid=true]{border-color:#222;background:#fff}
.note{font:13px monospace;color:#444;margin:8px 0 0}
dialog.m{position:fixed;inset:0;margin:auto;height:fit-content;display:revert}dialog.m::backdrop{background:rgba(0,0,0,.55)}dialog.m:not([open]){display:none}
</style></head><body><section class="frame"><p class="tag">modal dialog over list</p><div class="screen"><header class="top"><h1>My to-dos</h1><p class="who">Signed in as <strong>Asha</strong> <button>Sign out</button></p></header><main><form class="row"><label for="c-t" class="sr" style="position:absolute;left:-9999px">New to-do</label><input id="c-t" type="text" placeholder="What needs doing?"><button>Add</button></form><h2>Open (2)</h2><ul><li class=""><label class="chk" for="c-milk"><input type="checkbox" id="c-milk" aria-label="Mark Buy milk done"><span class="t">Buy milk<small>Added 22 Oct 2026, 7:12 pm IST</small></span></label><button class="del" aria-label="Delete Buy milk">Delete</button></li><li class=""><label class="chk" for="c-bank"><input type="checkbox" id="c-bank" aria-label="Mark Call the bank about the card done"><span class="t">Call the bank about the card<small>Added 22 Oct 2026, 6:40 pm IST</small></span></label><button class="del" aria-label="Delete Call the bank about the card">Delete</button></li></ul></main><p class="note">Modal via showModal(): backdrop, focus trapped, focus starts on Cancel. Esc or Cancel returns focus to the row's "Delete Buy milk" button.</p></div></section><dialog class="m" id="dlg" aria-labelledby="dt"><h2 id="dt">Delete "Buy milk"?</h2><p>This can't be undone.</p><div class="row"><button autofocus>Cancel</button><button class="danger">Delete</button></div></dialog><script>document.getElementById("dlg").showModal()</script></body></html>
