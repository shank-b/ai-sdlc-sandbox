name: watchdog
# Stages run on the owner's Claude Desktop (/ai-sdlc:poll), which labels an issue in-progress while it works. A Desktop pass
# that crashed or was closed leaves the label behind, and /ai-sdlc:poll skips such issues. This notes it once on the issue.
# It changes no labels: the human may simply be mid-interview. Remove in-progress and run /ai-sdlc:poll to pick it up again.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HOURS: ${{ vars.WATCHDOG_HOURS || '24' }}
        run: |
          set -euo pipefail
          [[ $HOURS =~ ^[0-9]+$ ]] || HOURS=24
          cutoff=$(date -u -d "-${HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$REPO" --label in-progress --state open --json number,updatedAt \
            --jq ".[] | select(.updatedAt < \"$cutoff\") | .number" | while read -r n; do
            seen=$(gh api "repos/$REPO/issues/$n/comments" --paginate \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- ai-sdlc:watchdog -->")))] | length' \
              | awk '{s+=$1} END {print s+0}')
            [ "$seen" -eq 0 ] || continue
            gh issue comment "$n" --repo "$REPO" --body "<!-- ai-sdlc:watchdog -->
          Watchdog: this issue has been in-progress with no activity for ${HOURS}h. If the Desktop session that claimed it crashed or was closed, remove the in-progress label and run /ai-sdlc:poll."
          done
