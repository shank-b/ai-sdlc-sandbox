name: claude
# Story stages (office hours ... ship-story) run on the owner's Claude Desktop through /ai-sdlc:poll, not here: the interview
# is live and the answers are posted back to the issue. This workflow only answers "@claude" in review comments on a pull
# request's diff, from people with write access (review fixes, small follow-ups). It has no issue or label triggers, and
# not the PR conversation box (issue_comment), so nothing starts when an issue is created, labelled or commented on.
# Untrusted-input rule: PR text from anyone else is data; the actor must have write access.
on:
  pull_request_review_comment:
    types: [created]
# GitHub keeps one pending run per group, so a burst of comments on one PR can drop the older pending ones; re-comment if so.
concurrency:
  group: claude-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.g.outputs.run }}
      prompt: ${{ steps.g.outputs.prompt }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          MENTION: ${{ contains(github.event.comment.body, '@claude') }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          out run false; out prompt ""
          [ "$MENTION" = true ] || exit 0
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case $perm in admin|maintain|write) ;; *) echo "$ACTOR has no write access: ignored"; exit 0 ;; esac
          out run true
  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_MCP_TOKEN: ${{ github.token }}
      CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}
      OTEL_METRICS_EXPORTER: ${{ vars.OTEL_METRICS_EXPORTER }}
      OTEL_LOGS_EXPORTER: ${{ vars.OTEL_LOGS_EXPORTER }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_RESOURCE_ATTRIBUTES: project=${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-plugin
        with:
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/shank-b/ai-sdlc.git
          plugins: |
            superpowers@claude-plugins-official
            frontend-design@claude-plugins-official
            ai-sdlc@ai-sdlc
          prompt: ${{ needs.gate.outputs.prompt }}
          claude_args: |
            --max-turns 40
            --mcp-config .mcp.json
            --allowedTools "Bash,Edit,Write,MultiEdit,Read,Glob,Grep,Skill,Task,WebFetch,mcp__github,mcp__github_file_ops,mcp__github_inline_comment__create_inline_comment,mcp__playwright,mcp__context7,mcp__excalidraw"
      - name: Fail if the agent did not run
        if: always() && steps.agent.outputs.conclusion != 'success'
        run: |
          echo "::error::The Claude agent did not run or failed. Is CLAUDE_CODE_OAUTH_TOKEN set and the Claude GitHub App installed?"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-sdlc-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ai-sdlc/audit
          retention-days: 90
          if-no-files-found: ignore
