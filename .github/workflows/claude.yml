name: claude
# Labels the owner applies drive the pipeline; @claude comments from people with write access run an agent.
# Untrusted-input rule: issue text from anyone else is data. Nothing runs unless the actor has write access and the issue
# carries `approved` plus a track:* label (comments on PRs only need the write-access check).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to continue (used by the watchdog)
        required: true
# GitHub keeps one pending run per group, so a burst of comments on one issue can drop the older pending ones; re-comment if so.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.g.outputs.run }}
      prompt: ${{ steps.g.outputs.prompt }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
          MENTION: ${{ contains(github.event.comment.body, '@claude') }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          out run false; out prompt ""
          [[ $ISSUE =~ ^[0-9]+$ ]] || { echo "no issue number"; exit 0; }
          if [ "$EVENT" != workflow_dispatch ]; then
            perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
            case $perm in admin|maintain|write) ;; *) echo "$ACTOR has no write access: ignored"; exit 0 ;; esac
          fi
          labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          has() { case ",$labels," in *",$1,"*) return 0 ;; esac; return 1; }
          track=; for t in feature ui bug spike; do if has "track:$t"; then track=$t; break; fi; done
          labelled=false; if has approved && { [ -n "$track" ] || has track:hotfix || has track:chore; }; then labelled=true; fi
          stage() {
            if has g2-approved; then echo "/ai-sdlc:ship-story $ISSUE"
            elif has g1-approved; then echo "/ai-sdlc:plan $ISSUE"
            else case $track in
              feature|spike) echo "/ai-sdlc:office-hours $ISSUE" ;;
              ui) echo "/ai-sdlc:wireframe $ISSUE" ;;
              bug) echo "/ai-sdlc:spec $ISSUE" ;;
            esac; fi
          }
          case $EVENT in
            issues)
              case $LABEL in approved|track:*|g1-approved|g2-approved) ;; *) echo "label $LABEL does not start a stage"; exit 0 ;; esac
              [ "$labelled" = true ] || { echo "issue is not approved + track"; exit 0; }
              p=$(stage); [ -n "$p" ] || { echo "no stage for this track: use an @claude comment"; exit 0; }
              out run true; out prompt "$p" ;;
            workflow_dispatch)
              [ "$labelled" = true ] || { echo "issue is not approved + track"; exit 0; }
              p=$(stage); [ -n "$p" ] || exit 0
              out run true; out prompt "$p" ;;
            *)
              [ "$MENTION" = true ] || exit 0
              if [ "$IS_PR" != true ] && [ "$labelled" != true ]; then echo "issue is not approved + track"; exit 0; fi
              out run true ;;
          esac
  claude:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_MCP_TOKEN: ${{ github.token }}
      CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_CODE_ENABLE_TELEMETRY }}
      OTEL_METRICS_EXPORTER: ${{ vars.OTEL_METRICS_EXPORTER }}
      OTEL_LOGS_EXPORTER: ${{ vars.OTEL_LOGS_EXPORTER }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_RESOURCE_ATTRIBUTES: project=${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-plugin
        with:
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
      - id: agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/shank-b/ai-sdlc.git
          plugins: |
            superpowers@claude-plugins-official
            frontend-design@claude-plugins-official
            ai-sdlc@ai-sdlc
          prompt: ${{ needs.gate.outputs.prompt }}
          claude_args: |
            --max-turns 40
            --mcp-config .mcp.json
            --allowedTools "Bash,Edit,Write,MultiEdit,Read,Glob,Grep,Skill,Task,WebFetch,mcp__github,mcp__github_file_ops,mcp__github_inline_comment__create_inline_comment,mcp__playwright,mcp__context7,mcp__excalidraw"
      - name: Fail if the agent did not run
        if: always() && steps.agent.outputs.conclusion != 'success'
        run: |
          echo "::error::The Claude agent did not run or failed. Is CLAUDE_CODE_OAUTH_TOKEN set and the Claude GitHub App installed?"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-sdlc-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ai-sdlc/audit
          retention-days: 90
          if-no-files-found: ignore
