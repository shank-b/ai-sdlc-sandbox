name: Bug
description: Something is broken. Doubles as a spec-lite once the owner labels it track:bug.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations: { required: true }
  - type: input
    id: environment
    attributes:
      label: Environment
      description: URL or version, browser and device.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Given / When / Then lines that prove it is fixed."
