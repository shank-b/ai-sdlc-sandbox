name: Spike
description: A research question. The result is a doc or ADR; nothing merges to main.
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations: { required: true }
  - type: input
    id: timebox
    attributes:
      label: Time box
      description: For example "half a day".
  - type: dropdown
    id: output
    attributes:
      label: Expected output
      options: [Doc, ADR]
